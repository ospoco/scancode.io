server {
    listen 80;
    server_name sc.ospo.co;
    
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sc.ospo.co;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/ospo.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ospo.co/privkey.pem;
    
    # Stronger SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Add HSTS if desired
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";

    # Root location - proxy to ScanCode.io web container
    location / {
        proxy_pass http://localhost:8001;  # Assuming you'll map container port 8000 to host port 8001
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # Longer timeouts for large files and scans
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
        
        # Allow larger uploads
        client_max_body_size 10G;
    }

    # Static files - serve directly from the host filesystem
    location /static/ {
        alias /home/mm/sites/scancode.io/static/;
        autoindex off;
        # Add proper headers for caching
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        # Allow access
        allow all;
        # Add debugging
        add_header X-Debug-Path $document_root$uri;
    }
}
